{{- if .Values.reconcile.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "keycloak-config.fullname" . }}
  labels:
    {{- include "keycloak-config.labels" . | nindent 4 }}
    app.kubernetes.io/component: reconcile
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  schedule: {{ .Values.reconcile.schedule | quote }}
  {{- with .Values.reconcile.timeZone }}
  timeZone: {{ . | quote }}
  {{- end }}
  {{/*
  config-cli takes no lock of its own — it reads a checksum off the realm and
  writes it back without a compare-and-swap — so two overlapping runs can
  interleave a whole realm update.
  */}}
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: {{ .Values.reconcile.startingDeadlineSeconds }}
  successfulJobsHistoryLimit: {{ .Values.reconcile.successfulJobsHistoryLimit }}
  failedJobsHistoryLimit: {{ .Values.reconcile.failedJobsHistoryLimit }}
  jobTemplate:
    spec:
      backoffLimit: {{ .Values.reconcile.backoffLimit }}
      template:
        metadata:
          labels:
            {{- include "keycloak-config.selectorLabels" . | nindent 12 }}
            app.kubernetes.io/component: reconcile
        spec:
          {{- include "keycloak-config.jobPodSpec" . | nindent 10 }}
{{- end }}
