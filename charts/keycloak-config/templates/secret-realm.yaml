{{- include "keycloak-config.validate" . }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "keycloak-config.realmSecretName" . }}
  labels:
    {{- include "keycloak-config.labels" . | nindent 4 }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
type: Opaque
stringData:
  {{/*
  A Secret rather than a ConfigMap: even with every credential substituted from
  the environment, a realm file still lists who exists and what they can do.
  */}}
  realm.yaml: |
    {{- include "keycloak-config.realmText" . | nindent 4 }}
