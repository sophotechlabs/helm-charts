{{- if or .Values.metrics.enabled .Values.keycloak.health.enabled }}
{{/*
The management port carries health and metrics. It is deliberately a separate
Service from the one a route points at, so /metrics is not reachable through
whatever is terminating TLS in front of Keycloak.
*/}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "keycloak.metricsServiceName" . }}
  labels:
    {{- include "keycloak.labels" . | nindent 4 }}
    app.kubernetes.io/component: metrics
  {{- with (merge (dict) .Values.metrics.service.annotations .Values.commonAnnotations) }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: ClusterIP
  ports:
    - name: management
      port: {{ .Values.keycloak.managementPort }}
      targetPort: management
      protocol: TCP
  selector:
    {{- include "keycloak.selectorLabels" . | nindent 4 }}
{{- end }}
