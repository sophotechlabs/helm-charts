{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "keycloak.fullname" . }}
  labels:
    {{- include "keycloak.labels" . | nindent 4 }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  podSelector:
    matchLabels:
      {{- include "keycloak.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    {{- if .Values.networkPolicy.egress.enabled }}
    - Egress
    {{- end }}
  ingress:
    - ports:
        - port: http
          protocol: TCP
        {{- if eq (include "keycloak.httpsEnabled" .) "true" }}
        - port: https
          protocol: TCP
        {{- end }}
      {{- with .Values.networkPolicy.ingress.from }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    - ports:
        - port: management
          protocol: TCP
      {{- with .Values.networkPolicy.ingress.metricsFrom }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    {{- if gt (int .Values.controller.replicas) 1 }}
    {{/*
    Cluster members talk to each other on the JGroups ports. Without this the
    cache silently fails to form once a policy is in place.
    */}}
    - ports:
        {{- range .Values.networkPolicy.clusterPorts }}
        - port: {{ . }}
          protocol: TCP
        {{- end }}
      from:
        - podSelector:
            matchLabels:
              {{- include "keycloak.selectorLabels" $ | nindent 14 }}
    {{- end }}
    {{- with .Values.networkPolicy.extraIngress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- if .Values.networkPolicy.egress.enabled }}
  egress:
    {{- with .Values.networkPolicy.egress.rules }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- end }}
{{- end }}
