[settings]
lockfile = true

[tools]
just = "1.58.0"
node = "24.19.0"

# charts
helm = "4.2.2"
helm-ct = "3.14.0"
helm-docs = "1.14.2"
kubeconform = "0.8.0"
kube-linter = "0.8.3"
kind = "0.32.0"
kubectl = "1.34.1"
yq = "4.48.1"

# hygiene
actionlint = "1.7.12"
editorconfig-checker = "3.11.2"
lychee = "0.24.2"
shellcheck = "0.11.0"
typos = "1.49.0"
yamllint = "1.38.0"
zizmor = "1.29.0"

# supply chain
cosign = "3.1.1"
gitleaks = "8.30.1"
grype = "0.117.0"
osv-scanner = "2.5.0"
syft = "1.51.0"
trivy = "0.74.0"
"pipx:semgrep" = "1.173.0"

[env]
# helm-unittest is a plugin rather than a binary, so `just deps` installs it
# and every recipe that needs it checks first.
HELM_UNITTEST_VERSION = "1.1.2"
