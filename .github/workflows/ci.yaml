---
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  HELM_VERSION: v3.19.0
  CT_VERSION: v3.14.0

jobs:
  yaml:
    name: yamllint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install yamllint==1.37.1
      - run: yamllint --strict .

  lint:
    name: ct lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: azure/setup-helm@v4
        with:
          version: ${{ env.HELM_VERSION }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: helm/chart-testing-action@v2
        with:
          version: ${{ env.CT_VERSION }}
      - name: List changed charts
        id: list
        run: |
          changed=$(ct list-changed --config ct.yaml)
          if [ -n "$changed" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
          echo "$changed"
      - name: Lint
        if: steps.list.outputs.changed == 'true'
        run: ct lint --config ct.yaml

  unittest:
    name: helm unittest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: azure/setup-helm@v4
        with:
          version: ${{ env.HELM_VERSION }}
      - run: helm plugin install https://github.com/helm-unittest/helm-unittest --version 1.1.2
      - name: Run suites
        run: helm unittest --strict --color charts/*/

  render:
    name: render and scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: azure/setup-helm@v4
        with:
          version: ${{ env.HELM_VERSION }}
      - name: Install kubeconform
        run: |
          curl -fsSL -o kubeconform.tar.gz \
            https://github.com/yannh/kubeconform/releases/download/v0.7.0/kubeconform-linux-amd64.tar.gz
          tar xzf kubeconform.tar.gz kubeconform
          sudo mv kubeconform /usr/local/bin/
      - name: Install kube-linter
        run: |
          curl -fsSL -o kube-linter.tar.gz \
            https://github.com/stackrox/kube-linter/releases/download/v0.7.6/kube-linter-linux.tar.gz
          tar xzf kube-linter.tar.gz kube-linter
          sudo mv kube-linter /usr/local/bin/
      - name: Render every scenario and scan it
        run: |
          # Each ci/*-values.yaml is a scenario the chart claims to support.
          # Rendering all of them is what stops a gated block rotting unnoticed.
          fail=0
          for chart in charts/*/; do
            for values in "$chart"ci/*-values.yaml; do
              [ -f "$values" ] || continue
              name="$(basename "$chart")-$(basename "$values" -values.yaml)"
              echo "::group::$name"
              if ! helm template "$name" "$chart" --namespace ci -f "$values" > "/tmp/$name.yaml"; then
                echo "::error::render failed for $name"
                fail=1
                echo "::endgroup::"
                continue
              fi
              kubeconform -strict -summary -ignore-missing-schemas \
                -schema-location default \
                -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
                "/tmp/$name.yaml" || fail=1
              kube-linter lint --config .kube-linter.yaml "/tmp/$name.yaml" || fail=1
              echo "::endgroup::"
            done
          done
          exit $fail

  install:
    name: ct install (k8s ${{ matrix.k8s }})
    runs-on: ubuntu-latest
    needs: [lint, unittest, render]
    strategy:
      fail-fast: false
      matrix:
        # Oldest and newest supported. The bare-cluster scenarios must pass on
        # a kind node with no CRDs installed at all, which is the point.
        k8s: ["v1.31.13", "v1.34.1"]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: azure/setup-helm@v4
        with:
          version: ${{ env.HELM_VERSION }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: helm/chart-testing-action@v2
        with:
          version: ${{ env.CT_VERSION }}
      - uses: helm/kind-action@v1
        with:
          node_image: kindest/node:${{ matrix.k8s }}
          cluster_name: ct
      - name: Install CRDs the scenarios need
        run: ./hack/install-crds.sh
      - name: Install and test
        run: ct install --config ct.yaml
