---
extends: default

ignore: |
  charts/*/templates/
  dist/

rules:
  line-length:
    max: 160
    level: warning
  comments:
    min-spaces-from-content: 1
  truthy:
    check-keys: false
  # Workflows and manifests here open with ---, values files and test suites do
  # not. Enforcing either way would be churn over a rule that carries no
  # meaning.
  document-start: disable
  braces:
    max-spaces-inside: 1
  octal-values:
    forbid-implicit-octal: true
    forbid-explicit-octal: true
