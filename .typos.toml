[files]
extend-exclude = [
  "CHANGELOG.md",
  "charts/*/CHANGELOG.md",
  "mise.lock",
]

[default]
# Image digests, cosign digests and the hex suffix Kubernetes appends to
# generated names are not prose; ignoring them by shape stops a permanent
# stream of false hits.
extend-ignore-re = [
  "\\b[0-9a-f]{7,40}\\b",
  "sha256:[0-9a-f]{64}",
]

[default.extend-words]
crds = "crds"
iam = "iam"
ro = "ro"
unparseable = "unparseable"
Unparseable = "Unparseable"
